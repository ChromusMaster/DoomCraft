name: DoomCraft - Verificar Runners

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-runners.yml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04

          - platform: windows-x86_64
            os: windows-2022

          - platform: macos-x86_64
            os: macos-15-intel

          - platform: macos-arm64
            os: macos-15

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v6

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Exibir sistema
        shell: bash
        run: |
          echo "Plataforma DoomCraft: ${{ matrix.platform }}"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          uname -a || true

      - name: Verificar ferramentas
        shell: bash
        run: |
          java -version
          python --version
          git --version
          cmake --version
          ninja --version || true

      - name: Verificar Gradle no Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Verificar Gradle no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\gradlew.bat --version
